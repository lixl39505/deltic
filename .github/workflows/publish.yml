name: Publish

on:
  push:
    tags:
      - "v*" # pnpm version creates a v-prefixed tag; postversion pushes it
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run all checks, skip the actual npm publish"
        type: boolean
        default: false

# npm trusted publishing: the job's OIDC token is exchanged for a
# short-lived publish credential — no NPM_TOKEN secret is involved.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage (100% gate)
        run: pnpm test:coverage

      - name: Build + e2e
        run: pnpm test:e2e

      - name: Verify pack contents (dist/ + bin/ only)
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance
